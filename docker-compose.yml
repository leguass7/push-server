services:
  postgres:
    image: postgres:16-alpine
    container_name: push-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pushserver
      POSTGRES_PASSWORD: pushserver_dev
      POSTGRES_DB: push_server
    ports:
      - "5433:5432"
    volumes:
      - push_server_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushserver -d push_server"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  push_server_pg_data:
