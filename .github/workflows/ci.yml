name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: lint + typecheck + test + build
        run: pnpm verify

  release-please:
    name: release-please
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  deploy:
    name: deploy
    needs: [verify, release-please]
    # GITHUB_TOKEN criando o GitHub Release não dispara o evento
    # `release` noutro workflow. O deploy tem de ocorrer neste run
    # quando o release-please acaba de criar a tag.
    if: >-
      always() &&
      (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      ) &&
      (
        github.event_name == 'release' ||
        needs.verify.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolver versão da imagem
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Login no registry PW2C
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.REGISTRY }}/push-server:latest
            ${{ secrets.REGISTRY }}/push-server:${{ steps.version.outputs.value }}

      - name: Acionar webhook do Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL vazia. Imagem publicada; stack não atualizada."
            echo "Ative o webhook do serviço no Portainer e grave o secret PORTAINER_WEBHOOK_URL."
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
          echo "Webhook acionado."
